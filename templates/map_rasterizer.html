        async function verifySession() {
            try {
                let accessToken = null;
                let refreshToken = null;

                // 1. Grok Fix #2: Read directly from window.location, matching both search (?) and hash (#) parameters safely
                const urlString = window.location.href;
                
                // Extract token (handling both 'token' or Supabase's native 'access_token')
                const tokenMatch = urlString.match(/[?&#](?:access_token|token)=([^&#]+)/);
                if (tokenMatch && tokenMatch[1]) {
                    accessToken = decodeURIComponent(tokenMatch[1]);
                }

                // Extract refresh token if it exists in the URL redirect payload
                const refreshMatch = urlString.match(/[?&#]refresh_token=([^&#]+)/);
                if (refreshMatch && refreshMatch[1]) {
                    refreshToken = decodeURIComponent(refreshMatch[1]);
                }

                let userResponse = null;

                // 2. Grok Fix #1: Only call setSession if we have a valid token payload incoming
                if (accessToken) {
                    // Build a valid session payload. If no refresh token came in, don't pass an empty string!
                    const sessionPayload = {
                        access_token: accessToken,
                        refresh_token: refreshToken || undefined
                    };

                    // Injects the session data securely into browser memory layers
                    const { data, error } = await supabaseClient.auth.setSession(sessionPayload);
                    
                    if (error) {
                        console.warn("Inbound cross-domain token hydration failed:", error.message);
                    } else if (data && data.user) {
                        userResponse = { data: { user: data.user } };
                    }
                }

                // 3. Fallback: If no redirect token was found, verify if a local storage session is already active
                if (!userResponse || !userResponse.data || !userResponse.data.user) {
                    userResponse = await supabaseClient.auth.getUser();
                }

                // 4. Grok Fix #5 & #6: Clear the address bar and lock in layout elements if successful
                if (userResponse.data && userResponse.data.user) {
                    userBadge.innerText = userResponse.data.user.email;
                    
                    // Wipe token metrics from address view bar cleanly so users don't see raw JWT hashes
                    if (accessToken) {
                        window.history.replaceState(null, null, window.location.origin + window.location.pathname);
                    }
                    return; // Halt route logic execution — User is logged in securely!
                } else {
                    throw new Error("No authenticated user profile could be verified from token parameters or local storage.");
                }

            } catch (err) {
                console.error("Critical Authentication Pipeline Halt:", err);
                
                // Grok Fix #4: Securely calculate local vs production portal targets to avoid render.com bouncing loops
                const localHome = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
                    ? "http://127.0.0.1:8080" 
                    : "https://landing-page-xlpu.onrender.com";

                userBadge.innerText = "Auth Error: Redirecting to Hub Portal...";
                userBadge.style.color = "#ff3333";
                
                setTimeout(() => {
                    window.location.href = localHome;
                }, 1500);
            }
        }



        gameLogoutBtn.addEventListener('click', async () => {
            userBadge.innerText = "Signing out...";
            await supabaseClient.auth.signOut();

        });

        verifySession();
    </script>

    <!-- 1. Inline Master Auth Synchronizer Script -->
    <script>
        console.log("🛠️ Master Inline Auth Synchronizer Script Active on Port 8000");

        const REAL_SUPABASE_URL = "https://oztxnrrhbrgzzibfolmc.supabase.co";
        const REAL_SUPABASE_ANON_KEY = "sb_publishable_umgeh3s19yYT7neVpzxoKw_JQ665XFh";
        
        window.supabaseClient = window.supabase.createClient(REAL_SUPABASE_URL, REAL_SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
            }
        });

        async function verifyAndGetRawUser() {
            try {
                let accessToken = null;
                let refreshToken = null;

                // 1. Native Browser Hash Fragment Parser (#token=...&refresh_token=...)
                if (window.location.hash) {
                    const hashString = window.location.hash.substring(1);
                    const hashParams = new URLSearchParams(hashString);
                    accessToken = hashParams.get('token') || hashParams.get('access_token');
                    refreshToken = hashParams.get('refresh_token');
                }

                // 2. Fallback Matcher: Check standard query parameter formats (?token=...)
                if (!accessToken) {
                    const urlParams = new URLSearchParams(window.location.search);
                    accessToken = urlParams.get('token') || urlParams.get('access_token');
                    refreshToken = urlParams.get('refresh_token');
                }

                if (accessToken) {
                    console.log("[DEBUG] Clean token string found! Hydrating session layer manually...");
                    
                    // Core Fix: Provide a fallback structural string if refresh_token is missing.
                    // This prevents the Supabase library from throwing "Auth session missing!".
                    const { data, error } = await window.supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken || "placeholder_local_refresh_token_string"
                    });
                    
                    if (error) {
                        console.error("Session hydration rejected:", error.message);
                    } else {
                        console.log("[DEBUG] Supabase session verified successfully.");
                    }
                    
                    // Clear out the query parameters safely from the address bar for security polish
                    window.history.replaceState(null, null, window.location.origin + window.location.pathname);
                }

                // Verify and extract the authentic user profile details
                const { data: { user }, error: userError } = await window.supabaseClient.auth.getUser();
                if (user && !userError) {
                    return user;
                }
                return null;

            } catch (err) {
                console.error("HTML Master Auth Sync Error:", err);
                return null;
            }
        }

        window.AUTH_SYNC_PROMISE = verifyAndGetRawUser();
    </script>
