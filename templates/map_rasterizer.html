<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Rasterizer Engine</title>
    <!-- Include Supabase script bundle so game engine front-end can process signouts cleanly -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1e1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        .nav-brand { font-size: 18px; font-weight: bold; color: #00ffcc; }
        .user-badge { font-size: 14px; background: #2a2a2a; padding: 6px 12px; border-radius: 4px; color: #aaa; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-home { background: #444; color: white; margin-right: 10px; }
        .btn-logout { background: #ff3333; color: white; }
        .game-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { border: 2px solid #333; background: #e270b3; }
        #status { margin-top: 10px; color: #00ffcc; font-size: 14px; }
    </style>
</head>
<body>
    
    <header>
        <div class="nav-brand">Project: map_rasterizer</div>
        <div>
            <span class="user-badge" id="game-user-email">Verifying Session Token...</span>
            <a href="#" id="return-home-btn" class="btn btn-home">← Return Home Hub</a>
            <!-- <a href="/" id="return-home-btn" class="btn btn-home">← Return Home Hub</a> -->
            <!-- <a href="https://landing-page-xlpu.onrender.com" id="return-home-btn" class="btn btn-home">← Return Home Hub</a> -->
            <button class="btn btn-logout" id="game-logout-btn">Log Out</button>
        </div>
    </header>

    <div class="game-zone">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="status">Network Engine Status: Connecting Socket Interface Pipeline...</div>
    </div>


    <!-- 1. Inline Master Auth Synchronizer Script -->
    <script>
        console.log("🛠️ Master Inline Auth Synchronizer Script Active on Port 8000");

        const REAL_SUPABASE_URL = "https://oztxnrrhbrgzzibfolmc.supabase.co";
        const REAL_SUPABASE_ANON_KEY = "sb_publishable_umgeh3s19yYT7neVpzxoKw_JQ665XFh";
        
        window.supabaseClient = window.supabase.createClient(REAL_SUPABASE_URL, REAL_SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
            }
        });

        async function verifyAndGetRawUser() {
            try {
                let accessToken = null;
                let refreshToken = null;

                // 1. Native Browser Hash Fragment Parser (#token=...&refresh_token=...)
                if (window.location.hash) {
                    const hashString = window.location.hash.substring(1);
                    const hashParams = new URLSearchParams(hashString);
                    accessToken = hashParams.get('token') || hashParams.get('access_token');
                    refreshToken = hashParams.get('refresh_token');
                }

                // 2. Fallback Matcher: Check standard query parameter formats (?token=...)
                if (!accessToken) {
                    const urlParams = new URLSearchParams(window.location.search);
                    accessToken = urlParams.get('token') || urlParams.get('access_token');
                    refreshToken = urlParams.get('refresh_token');
                }

                if (accessToken) {
                    console.log("[DEBUG] Clean token string found! Hydrating session layer manually...");
                    
                    // Core Fix: Provide a fallback structural string if refresh_token is missing.
                    // This prevents the Supabase library from throwing "Auth session missing!".
                    const { data, error } = await window.supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken || "placeholder_local_refresh_token_string"
                    });
                    
                    if (error) {
                        console.error("Session hydration rejected:", error.message);
                    } else {
                        console.log("[DEBUG] Supabase session verified successfully.");
                    }
                    
                    // Clear out the query parameters safely from the address bar for security polish
                    window.history.replaceState(null, null, window.location.origin + window.location.pathname);
                }

                // Verify and extract the authentic user profile details
                const { data: { user }, error: userError } = await window.supabaseClient.auth.getUser();
                if (user && !userError) {
                    return user;
                }
                return null;

            } catch (err) {
                console.error("HTML Master Auth Sync Error:", err);
                return null;
            }
        }

        window.AUTH_SYNC_PROMISE = verifyAndGetRawUser();
    </script>

    <!-- 2. Main Game Module Launcher -->
    <script type="module">
        // Bump cache-buster string to version 11 to override browser local history storage
        import { initGame } from '/static/js/map_rasterizer/mainClient.js?v=11';

        window.AUTH_SYNC_PROMISE.then((verifiedUser) => {
            if (verifiedUser) {
                console.log("[DEBUG] Passing verified user parameters down to game layout engine modules.");
                initGame(verifiedUser);
            } else {
                console.error("❌ CRITICAL: Authentication check returned NULL. Page session is unauthenticated.");
                document.getElementById('game-user-email').innerText = "Auth Error: Session Unverified";
                document.getElementById('game-user-email').style.color = "#ff3333";
            }
        });
    </script>

</body>
</html>
