<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Rasterizer Engine</title>
    <!-- Include Supabase script bundle so game engine front-end can process signouts cleanly -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1e1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        .nav-brand { font-size: 18px; font-weight: bold; color: #00ffcc; }
        .user-badge { font-size: 14px; background: #2a2a2a; padding: 6px 12px; border-radius: 4px; color: #aaa; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-home { background: #444; color: white; margin-right: 10px; }
        .btn-logout { background: #ff3333; color: white; }
        .game-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { border: 2px solid #333; background: #bbff00; }
        #status { margin-top: 10px; color: #00ffcc; font-size: 14px; }
    </style>
</head>
<body>
    
    <header>
        <div class="nav-brand">Project: map_rasterizer</div>
        <div>
            <span class="user-badge" id="game-user-email">Verifying Session Token...</span>
            <a href="#" id="return-home-btn" class="btn btn-home">← Return Home Hub</a>
            <button class="btn btn-logout" id="game-logout-btn">Log Out</button>
        </div>
    </header>

    <div class="game-zone">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="status">Network Engine Status: Connecting Socket Interface Pipeline...</div>
    </div>

    <!-- Embed the secure verified runtime token directly as a global JS parameter variable object -->
    <!-- Update the script block in map_rasterizer.html to this: -->
    <!-- Update the script block at the bottom of map_rasterizer.html -->
    <script>
        // 🟢 FIX A: Enclose the token in quotes so JavaScript parses it as a literal string
        window.AUTH_TOKEN = "{{ token }}";

        // Initialize secure Supabase Client Instance
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_umgeh3s19secretpzxoKw_JQ665XFh";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch UI DOM Element Bindings
        const userBadge = document.getElementById('game-user-email');
        const gameLogoutBtn = document.getElementById('game-logout-btn');
        const homeBtn = document.getElementById('return-home-btn');

        // Dynamic Environment Routing Controller Pipeline
        const currentHost = window.location.hostname;
        if (currentHost === "localhost" || currentHost === "127.0.0.1") {
            homeBtn.href = "http://127.0.0.1:8080"; 
        } else {
            homeBtn.href = "https://onrender.com"; 
        }

        // Session Validation and Email Badge Render Execution
        async function verifySession() {
            try {
                // 🟢 FIX B: Safely confirm that Python actually replaced the placeholder text 
                // with a real, live base64 web token hash before injecting it into memory
                if (window.AUTH_TOKEN && window.AUTH_TOKEN !== "" && !window.AUTH_TOKEN.includes("{")) {
                    await supabaseClient.auth.setSession({
                        access_token: window.AUTH_TOKEN,
                        refresh_token: "" 
                    });
                }

                // Verify session against Supabase
                const { data: { user }, error } = await supabaseClient.auth.getUser();

                if (user && !error) {
                    // Success! Display verified email address badge context
                    userBadge.innerText = user.email;
                } else {
                    throw new Error("Invalid or expired session token.");
                }
            } catch (err) {
                // Bounce them back directly to your landing portal hub for re-auth
                userBadge.innerText = "Auth Error: Redirecting...";
                userBadge.style.color = "#ff3333";
                setTimeout(() => {
                    window.location.href = homeBtn.href;
                }, 1200);
            }
        }

        // Cross-domain session sign-out event handler sequence
        gameLogoutBtn.addEventListener('click', async () => {
            userBadge.innerText = "Signing out...";
            await supabaseClient.auth.signOut();
            window.location.href = homeBtn.href;
        });

        // Run verification loop on initialization
        verifySession();
    </script>


    <script type="module" src="/static/js/map_rasterizer/mainClient.js"></script>
</body>
</html>
