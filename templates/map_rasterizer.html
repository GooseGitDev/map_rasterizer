    <!-- Corrected validation block inside templates/map_rasterizer.html -->
    <script>
        const SUPABASE_URL = "https://oztsecretsmc.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_umgeh3s19secretpzxoKw_JQ665XFh";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const userBadge = document.getElementById('game-user-email');
        const gameLogoutBtn = document.getElementById('game-logout-btn');
        const homeBtn = document.getElementById('return-home-btn');

        const currentHost = window.location.hostname;
        if (currentHost === "localhost" || currentHost === "127.0.0.1") {
            homeBtn.href = "http://127.0.0.1:8080"; 
        } else {
            // homeBtn.href = "https://onrender.com"; 
            homeBtn.href = "https://landing-page-xlpu.onrender.com";
        }

        async function verifySession() {
            try {
                const hash = window.location.hash;
                
                if (hash && hash.includes('access_token')) {
                    const params = new URLSearchParams(hash.replace('#', '?'));
                    const parsedToken = params.get('access_token');
                    
                    if (parsedToken) {
                        // 🟢 Await the token injection operation securely
                        const { data, error: setSessionError } = await supabaseClient.auth.setSession({
                            access_token: parsedToken,
                            refresh_token: "" 
                        });

                        if (setSessionError) throw setSessionError;

                        // Give storage arrays a split second (100ms) to finalize write parameters
                        await new Promise(resolve => setTimeout(resolve, 100));
                        
                        window.history.replaceState(null, null, window.location.origin + window.location.pathname);
                    }
                }

                // Query profile metadata properties
                const { data: { user }, error } = await supabaseClient.auth.getUser();

                if (user && !error) {
                    userBadge.innerText = user.email;
                } else {
                    if (error) console.error("Supabase User API Error Context:", error.message);
                    throw new Error("Absent or invalid token match context.");
                }
            } catch (err) {
                // 🟢 Logs the true hidden security block out to your Inspector inspect console
                console.error("Critical Authentication Pipeline Halt:", err);
                
                userBadge.innerText = "Auth Error: Redirecting...";
                userBadge.style.color = "#ff3333";
                setTimeout(() => {
                    window.location.href = homeBtn.href;
                }, 1500);
            }
        }

        gameLogoutBtn.addEventListener('click', async () => {
            userBadge.innerText = "Signing out...";
            await supabaseClient.auth.signOut();
            window.location.href = homeBtn.href;
        });

        verifySession();
    </script>
